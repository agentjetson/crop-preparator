syntax = "proto3";

package crop.v1;

option cc_enable_arenas = true;
option go_package = "github.com/agentjetson/contract/gen/go/crop/v1;cropv1";

import "google/protobuf/timestamp.proto";
import "detection/v1/detection.proto";

// PreparedCrop is an optional side-channel from crop-preparator.
// Specialists may instead consume an enriched ObjectEnvelope (updated crop_jpeg
// + labels). This message exists when a specialist needs a named ROI
// (plate_roi, face, padded) without mutating the original envelope.
//
// Subject (optional): cv.crop.<crop_kind>
// Not persisted to ClickHouse — hot-path bytes only.
message PreparedCrop {
  int64  frame_id           = 1;
  google.protobuf.Timestamp timestamp = 2;
  string source             = 3;
  int32  track_id           = 4;
  string class_name         = 5;
  string crop_kind          = 6;   // "full" | "plate_roi" | "face" | "padded"
  detection.v1.BoundingBox box = 7;
  bytes  jpeg               = 8;
  int32  width              = 9;
  int32  height             = 10;
  map<string, string> labels = 11;
}
